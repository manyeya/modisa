[package]
name = "modisa"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26.0"
ansi-to-tui = { version = "8.0.1", default-features = false }
base64 = "0.23.1"
crossterm = "0.29.0"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.190"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.3"
regex = "1.13.1"
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
throbber-widgets-tui = "0.11.1"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["rt", "net", "process", "time", "macros", "io-util", "signal", "sync", "fs"] }
toml = "1.1.7"
tui-big-text = "0.8.10"
tui-input = "0.15.5"
tui-markdown = { version = "0.3.10", default-features = false }
tui-tree-widget = "0.24.1"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# `modisa notch`: the flock in the MacBook's notch (src/notch)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAffineTransform", "NSArray", "NSAttributedString", "NSDate", "NSDictionary", "NSEnumerator", "NSGeometry", "NSString", "NSTimer"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2-core-foundation", "NSAffineTransform", "NSApplication", "NSAttributedString", "NSBezierPath", "NSColor", "NSEvent", "NSFont", "NSFontDescriptor", "NSBitmapImageRep", "NSGradient", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSStringDrawing", "NSView", "NSWindow"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
