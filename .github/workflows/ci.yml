# Unit tests, a release build, and the end-to-end suite (parity/run.sh) on Linux and macOS. Runs for pushes to dev,
# for pull requests, and as the first step of every release (see release.yml).
name: CI
on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the e2e suite comes from the TypeScript build's last commit
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install zsh (the panes suite runs a zsh pane)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: cargo test --locked
      - name: Release build runs
        run: cargo build --release --locked && ./target/release/modisa --version
      - name: End-to-end suite
        run: parity/run.sh
