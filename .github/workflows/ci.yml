# Typecheck, the full test suite and a compiled build on Linux and macOS. Runs for pushes to dev,
# for pull requests, and as the first step of every release (see release.yml).
name: CI
on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install zsh (the panes suite runs a zsh pane)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Compiled build runs
        run: bun run build && ./dist/modisa --version
