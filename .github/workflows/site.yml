# Rebuilds and redeploys the docs site from main once a day, so the plugin directory picks up plugins published since
# the last release. It builds what's on main; no release is cut.
name: Site
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  pages:
    runs-on: ubuntu-24.04
    concurrency: { group: pages, cancel-in-progress: false } # shared with release.yml's deploy
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - name: Build the site (and check every link)
        run: bun site/build.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deploy
        uses: actions/deploy-pages@v4
