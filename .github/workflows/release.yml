# Every push to main is a release; every push to staging replaces the rolling "staging" prerelease.
#   test → version (from git tags; see .github/scripts/next-version.ts) → a native build per
#   platform → release with SHA256SUMS + manifest.json (what `shepherd update` and install.sh read)
#   → on main, the docs site on GitHub Pages. A push that only changes docs skips the release.
name: Release
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      changed: ${{ steps.v.outputs.changed }}
      last: ${{ steps.v.outputs.last }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - id: v
        run: bun .github/scripts/next-version.ts ${{ github.ref_name == 'main' && 'stable' || 'staging' }} ${{ github.run_number }}
      - run: echo "Releasing ${{ steps.v.outputs.version }} (changed=${{ steps.v.outputs.changed }})"

  build:
    needs: [test, version]
    if: needs.version.outputs.changed == 'true'
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64 }
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OUT: shepherd-${{ matrix.platform }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Compile
        run: bun build --compile --minify --define "BUILD_VERSION=\"$VERSION\"" src/main.ts --outfile "$OUT"
      - name: Sign (ad hoc)
        if: runner.os == 'macOS'
        run: codesign --remove-signature "$OUT" && codesign -s - "$OUT"
      - name: Smoke test
        run: |
          ./"$OUT" --version | tee version.txt
          grep -F "shepherd $VERSION" version.txt
          ./"$OUT" integration status > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      NOTES: ${{ needs.version.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/download-artifact@v4
        with:
          pattern: shepherd-*
          merge-multiple: true
          path: dist
      - name: Checksums and manifest
        run: |
          printf '%s\n' "$NOTES" > notes.md
          bun .github/scripts/release-assets.ts "$VERSION" "$CHANNEL" "$TAG" dist notes.md
          ls -l dist
      - name: Release
        if: env.CHANNEL == 'stable'
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "shepherd $VERSION" --notes-file notes.md --latest
      - name: Staging prerelease
        if: env.CHANNEL == 'staging'
        run: |
          gh release delete staging --cleanup-tag --yes || true
          gh release create staging dist/* --target "$GITHUB_SHA" --title "shepherd $VERSION (staging)" --notes-file notes.md --prerelease

  pages:
    needs: [version, publish]
    if: always() && github.ref_name == 'main' && needs.version.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/configure-pages@v5
      - name: Build the site (and check every link)
        run: bun site/build.ts
        env:
          SHEPHERD_VERSION: ${{ needs.publish.result == 'success' && needs.version.outputs.version || needs.version.outputs.last }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deploy
        uses: actions/deploy-pages@v4
