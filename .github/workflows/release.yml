# Every push to main is a release; every push to staging replaces the rolling "staging" prerelease.
#   test → version (from git tags; see .github/scripts/next-version.ts) → a native build per
#   platform → release with SHA256SUMS + manifest.json (what `modisa update` and install.sh read),
#   .deb/.rpm packages and signed build provenance (`gh attestation verify <file> -R manyeya/modisa`)
#   → on main, the Homebrew formula in manyeya/homebrew-tap (when the HOMEBREW_TAP_TOKEN secret is set)
#   and the docs site on GitHub Pages. A push that only changes docs skips the release.
name: Release
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      changed: ${{ steps.v.outputs.changed }}
      last: ${{ steps.v.outputs.last }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - id: v
        run: bun .github/scripts/next-version.ts ${{ github.ref_name == 'main' && 'stable' || 'staging' }} ${{ github.run_number }}
      - run: echo "Releasing ${{ steps.v.outputs.version }} (changed=${{ steps.v.outputs.changed }})"

  build:
    needs: [test, version]
    if: needs.version.outputs.changed == 'true'
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64 }
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OUT: modisa-${{ matrix.platform }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Compile
        run: bun build --compile --minify --define "BUILD_VERSION=\"$VERSION\"" src/main.ts --outfile "$OUT"
      - name: Sign (ad hoc)
        if: runner.os == 'macOS'
        run: codesign --remove-signature "$OUT" && codesign -s - "$OUT"
      - name: Smoke test
        run: |
          ./"$OUT" --version | tee version.txt
          grep -F "modisa $VERSION" version.txt
          ./"$OUT" integration status > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      NOTES: ${{ needs.version.outputs.notes }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/download-artifact@v4
        with:
          pattern: modisa-*
          merge-multiple: true
          path: dist
      - name: Checksums and manifest
        run: |
          printf '%s\n' "$NOTES" > notes.md
          bun .github/scripts/release-assets.ts "$VERSION" "$CHANNEL" "$TAG" dist notes.md
          ls -l dist
      # after the manifest, so the packages stay out of it; their checksums join SHA256SUMS
      - name: Linux packages (.deb, .rpm)
        run: |
          mkdir -p build
          for target in linux-x64:amd64 linux-arm64:arm64; do
            cp "dist/modisa-${target%%:*}" build/modisa
            for packager in deb rpm; do
              docker run --rm -v "$PWD:/work" -w /work -e VERSION -e ARCH="${target##*:}" \
                goreleaser/nfpm:v2.47.0 package --config .github/nfpm.yaml --packager "$packager" --target dist/
            done
          done
          # GitHub turns the "~" of a prerelease version (0.2.0~staging.3) into "." when it uploads a file,
          # so name the files that way first, or SHA256SUMS lists names the release doesn't have
          for f in dist/*~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done
          (cd dist && sha256sum ./*.deb ./*.rpm | sed 's| \./| |' >> SHA256SUMS)
          ls -l dist
      - name: Build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/modisa-darwin-*
            dist/modisa-linux-*
            dist/*.deb
            dist/*.rpm
      - name: Release
        if: env.CHANNEL == 'stable'
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "modisa $VERSION" --notes-file notes.md --latest
      - name: Staging prerelease
        if: env.CHANNEL == 'staging'
        run: |
          gh release delete staging --cleanup-tag --yes || true
          gh release create staging dist/* --target "$GITHUB_SHA" --title "modisa $VERSION (staging)" --notes-file notes.md --prerelease
      - name: Homebrew tap
        if: env.CHANNEL == 'stable' && env.TAP_TOKEN != ''
        run: |
          bun .github/scripts/homebrew-formula.ts dist/manifest.json modisa.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/manyeya/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp modisa.rb tap/Formula/modisa.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/modisa.rb
          git diff --cached --quiet || { git commit -m "modisa $VERSION" && git push; }

  pages:
    needs: [test, version, publish]
    if: always() && github.ref_name == 'main' && needs.test.result == 'success' && needs.version.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    concurrency: { group: pages, cancel-in-progress: false } # shared with site.yml's daily refresh
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - name: Build the site (and check every link)
        run: bun site/build.ts
        env:
          MODISA_VERSION: ${{ needs.publish.result == 'success' && needs.version.outputs.version || needs.version.outputs.last }}
          GITHUB_TOKEN: ${{ github.token }} # the plugin directory's GitHub search
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deploy
        uses: actions/deploy-pages@v4
